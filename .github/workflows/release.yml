name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK + Web and Release
    runs-on: [self-hosted, n100]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Ensure Android platform 36 & build-tools
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)"
          yes | "$SDKMGR" --licenses >/dev/null
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Provide dev-only secret stub (CI only)
        run: |
          # src/lib/dev-secret.ts is git-ignored (local dev convenience only).
          # On a clean CI checkout the module must exist for the import in
          # src/lib/credentials.ts to resolve; an empty value matches the
          # documented "clean checkout" behavior (normal auth screen shown).
          printf 'export const DEV_BOOTSTRAP_SECRET = "";\n' > src/lib/dev-secret.ts

      - name: Generate native Android project (CNG)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle + native build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            node_modules/*/android/build
            node_modules/*/android/.cxx
            android/app/.cxx
            android/app/build/intermediates/cmake
            android/app/build/intermediates/cxx
            ~/.ccache
          key: nb-android-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: |
            nb-android-${{ runner.os }}-

      - name: Build Android Release APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
          # Limit to a single ABI on shared/self-hosted runners to keep
          # memory pressure down while compiling React Native's C++.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          # Persistent C++ compiler cache (hosted in /home/runner/.ccache,
          # bound to a NAS volume). First build seeds the cache; subsequent
          # builds only recompile what actually changed.
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: "2G"
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Web (static export)
        run: npx expo export --platform web

      - name: Prepare release artifacts
        run: |
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release-assets/nanobot-${VERSION}.apk"
          cd dist && zip -r "../release-assets/nanobot-${VERSION}-web.zip" . && cd ..
          ( cd release-assets && ls -la && sha256sum *.apk *.zip > checksums.txt )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.zip
            release-assets/checksums.txt
